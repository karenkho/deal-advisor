# How AI-enabled delivery works after award (POC v2). ASSUMPTIONS about delivery, used in the estimate; editable.
# Applied deterministically AFTER the suitability agent (its suggestion is kept as llm_suggestion). Use cases and test
# cases are post-award artifacts: this presales tool never produces them, it only assumes how they will be produced.
version: 1
automatable_share: 0.7            # DP-04: share of QA execution and regression run by generated automated suites
practices:
  - id: DP-01
    assumption: "After award, use cases and acceptance criteria are generated by AI from the approved BRD; the BA reviews and edits."
    effect: "BA story & acceptance-criteria writing: ai_first_with_review in C, ai_assisted in B."
    activities: [BA.stories_acceptance]
    category: ai_first_with_review
  - id: DP-02
    assumption: "Wireframes and prototypes are generated by AI; the BA validates with the client."
    effect: "BA wireframes & prototypes: ai_first_with_review in C."
    activities: [BA.wireframes_prototypes]
    category: ai_first_with_review
  - id: DP-03
    assumption: "Test cases are generated by AI from use-case flows; QA reviews coverage."
    effect: "QA test design: ai_first_with_review in C."
    activities: [QA.test_design]
    category: ai_first_with_review
  - id: DP-04
    assumption: "Test execution and regression run as automated suites generated from those test cases; humans do exploratory testing and defect triage."
    effect: "QA test execution and regression & defect verification: the automatable share is deterministic_automated in C; the remainder stays ai_assisted."
    activities: [QA.test_execution, QA.regression_defects]
    split: true
  - id: DP-05
    assumption: "Standard CRUD screens, reports and integrations with documented APIs are generated AI-first with review."
    effect: "Backend/Frontend coding, unit tests and component tests of clear standard features: ai_first_with_review in C."
    activities: [Backend.coding, Backend.unit_tests, Frontend.ui_implementation, Frontend.component_tests]
    category: ai_first_with_review
    feature_types: [screen_crud, report_dashboard, admin_config, notification]
    documented_integrations: true   # also integration features whose text names a documented counterpart or format
  - id: DP-06
    assumption: "Security logic stays human-supervised."
    effect: "Authentication, authorization/RBAC enforcement, encryption, personal-data handling/export logic and payroll computation: at most ai_assisted."
  - id: DP-07
    assumption: "Client-facing elicitation and acceptance stay human."
    effect: "BA elicitation and acceptance support: human_led."
    activities: [BA.elicitation_clarification, BA.review_acceptance_support]
    category: human_led
